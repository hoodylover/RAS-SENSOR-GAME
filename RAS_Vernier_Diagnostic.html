<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAS Vernier 센서 진단</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:auto;padding:18px;line-height:1.5}button{padding:12px;margin:4px;border:1px solid #999;border-radius:9px;background:#f6f6f6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111;color:#bdf7c7;padding:15px;border-radius:8px;min-height:200px}small{color:#555}</style></head><body><h2>RAS · Vernier Go Direct 진단</h2><p>Chrome + HTTPS 환경에서 실행하세요. Graphical Analysis를 완전히 종료하고 센서 전원을 재시작하세요.</p><button id="connect">1. 센서 연결</button><button id="force" disabled>2. Force 채널 수집</button><button id="resp" disabled>3. 호흡수 채널 수집</button><button id="stop" disabled>4. 연결 종료</button><button id="save">로그 저장</button><p id="status">대기 중</p><pre id="log"></pre><small>센서 값이 NaN인지, 이벤트가 발생하는지, 초기화 오류가 발생하는지 확인합니다. 의료 용도가 아닙니다.</small><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><script>
let device=null,lines=[],count=0;const $=id=>document.getElementById(id);function log(x){let s=new Date().toLocaleTimeString()+' '+x;lines.push(s);$('log').textContent=lines.slice(-160).join('\n');}function err(e){log('ERROR '+(e?.stack||e?.message||String(e)));}function state(s){$('status').textContent=s;log(s)}function sensors(){return device?.sensors||[]}async function collect(index){try{let s=sensors().find(x=>Number(x.number??x.id)===index)||sensors()[index===1?0:1];if(!s){log('해당 센서 없음');return}log('선택: '+s.name+' / '+s.unit+' / channel '+index);s.enabled=true;count=0;s.on('value-changed',v=>{count++;if(count<=40)log('EVENT '+count+' '+v.name+' = '+String(v.value)+' '+v.unit)});state('수집 시도 중');await device.start(100);state('수집 시작 요청 완료. 15초 동안 값 확인');}catch(e){err(e)}}$('connect').onclick=async()=>{try{if(!window.godirect){state('라이브러리 로딩 실패');return}state('센서 선택창 열기');device=await godirect.selectDevice();state('장치 선택 완료: '+(device?.name||'이름 없음'));sensors().forEach((s,i)=>log('채널 '+i+': '+s.name+' / '+s.unit+' / id='+String(s.number??s.id??'?')));$('force').disabled=false;$('resp').disabled=false;$('stop').disabled=false;}catch(e){err(e)}};$('force').onclick=()=>collect(1);$('resp').onclick=()=>collect(2);$('stop').onclick=async()=>{try{await device?.stop?.();await device?.close?.();state('종료 요청 완료')}catch(e){err(e)}};$('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='RAS_sensor_log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};log('준비 완료 / HTTPS 여부: '+window.isSecureContext);
</script></body></html>
